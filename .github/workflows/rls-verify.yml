name: RLS Live Verification

# plan.md §21.2.2 STEP 4 / §21.3 exit criteria: this answers "is Postgres
# RLS actually enforcing right now on the live deployment", which needs
# live Supabase + Clerk credentials and a real deployed target. That's a
# different question from ci.yml's per-push suite (which only proves the
# app's own orchestration logic against mocked clients -- plan.md §21.2.2
# rejected a mocked-client test for this exact reason: a mock cannot tell
# you whether auth.uid() resolves in a real project). Manual/scheduled
# only, never a per-PR gate -- blocking every push on a network round trip
# to a live database is the wrong trade, and this needs secrets a PR from
# a fork must never see.
on:
  # Manual only -- the weekly cron was disabled 2026-09-15 after 3
  # consecutive scheduled failures (09-07, 09-13, 09-14), all the same
  # root cause: RLS_TEST_USER_A/B_SESSION_ID are Clerk *session* ids,
  # which expire; Clerk's /v1/sessions/{id}/tokens 404s once they do. Not
  # an RLS regression -- the check itself last passed fine. Run this by
  # hand (with fresh session ids) when actually needed, e.g. after
  # touching auth/RLS config.
  workflow_dispatch: {}

jobs:
  verify-rls:
    runs-on: ubuntu-latest
    # continue-on-error: a stale-token 404 (see above) must not paint this
    # red in the Actions tab -- only a real RLS finding should. Re-tighten
    # once session-id refresh is automated.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        # Matches the actually-committed ci.yml (requirements.txt /
        # requirements-dev.txt, no --require-hashes) -- NOT the uncommitted
        # working-tree draft of ci.yml, which references
        # requirements.lock.txt/requirements-dev.lock.txt that were never
        # committed to this repo and don't exist on a fresh checkout.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run scripts/verify_rls.py
        env:
          RLS_VERIFY_BASE_URL: ${{ secrets.RLS_VERIFY_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          RLS_TEST_USER_A_SESSION_ID: ${{ secrets.RLS_TEST_USER_A_SESSION_ID }}
          RLS_TEST_USER_B_SESSION_ID: ${{ secrets.RLS_TEST_USER_B_SESSION_ID }}
          # Optional -- only set if the deployment has Vercel's "Protection
          # Bypass for Automation" configured. Without it, a live run's
          # Layer 2 checks 429 against Vercel's own bot-challenge page
          # before reaching Flask/FastAPI (confirmed 2026-08-31, unrelated
          # to RLS or the 3 custom WAF rules in docs/SECURITY.md §7).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python3 scripts/verify_rls.py
