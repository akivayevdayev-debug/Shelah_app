name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff (non-blocking for now)
        run: ruff check .
        continue-on-error: true

      - name: Run tests with coverage
        run: pytest --cov-report=xml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Node unit tests (node --test)
        # plan.md §41.3: this suite was never wired into CI. tests_js/sentry_init.test.js
        # (14 cases) verifies halachic question/answer text, Clerk auth tokens, and
        # session cookies never reach Sentry (plan.md §17); Prompt 32/§19 Phase 0 added
        # tests_js/reader_ui_semantic_bookmark.test.js (4 cases) with the same exposure.
        # Both pass locally today (18/18) and gate PII-scrubbing correctness, so this is
        # blocking rather than continue-on-error, unlike ruff/pip-audit above (which are
        # non-blocking because their fix workflows aren't established yet). The glob form
        # (package.json's `test` script, `node --test tests_js/*.test.js`) sidesteps a
        # Node bug where a bare directory argument to `--test` throws
        # `Cannot find module` (plan.md §41.4) — confirmed on Node v26.7.0 locally; this
        # step is the first run against the CI runner's pinned Node 24 specifically.
        run: npm test

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
