name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        # Security audit P2 / SonarCloud githubactions:S8544 x2, S8541:
        # hash-verified, binary-only install instead of an unpinned,
        # unverified transitive resolve that could fall back to executing
        # an sdist's build-backend code. requirements.lock.txt /
        # requirements-dev.lock.txt are regenerated from requirements.txt /
        # requirements-dev.txt via `uv pip compile --generate-hashes` — see
        # the header comment in either lock file for the exact command.
        # julian/memoization (zmanim's own direct deps) are the sole
        # --no-binary exception: verified sdist-only on PyPI, see
        # requirements.lock.txt's header for how that was confirmed.
        #
        # pre-commit, pip-audit and pip itself (formerly `pip install
        # --upgrade pip` / `pip install pre-commit` / `pip install pip-audit`
        # here and in the two steps below -- SonarCloud githubactions:S8544 +
        # S8541) are now part of requirements-dev.lock.txt, so this single
        # hash-verified, binary-only command is the only pip install in the
        # job. pip is replaced by its locked, hash-verified version by this
        # very command; no separate un-hashed `--upgrade pip` is needed.
        run: |
          pip install --require-hashes --only-binary=:all: --no-binary=julian,memoization \
            -r requirements.lock.txt -r requirements-dev.lock.txt

      - name: Lint with ruff (non-blocking for now)
        run: ruff check .
        continue-on-error: true

      - name: Security scan — secrets + static analysis (pre-commit, all files)
        # plan.md §8.C.4: the gitleaks/bandit hooks in .pre-commit-config.yaml
        # only run locally and are bypassable with --no-verify; this runs the
        # same hooks in CI against every file on every push so a skipped
        # local hook can't ship a secret or a bandit-flagged pattern.
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Dependency vulnerability scan (pip-audit)
        # plan.md §8.C.4 SCA gate. Non-blocking for now, matching the ruff
        # step above -- this is the first pass wiring pip-audit in, and a
        # hard-fail-on-CVE gate needs an established remediation workflow
        # (e.g. for dev-only deps like pytest where a fix requires a major-
        # version bump) before it can safely block merges. See
        # docs/SECURITY.md for the current findings this surfaced.
        run: |
          # Each lock file audited separately, --disable-pip: the two files
          # pin some packages (e.g. pygments) at different versions for
          # their own dependency trees, which pip-audit's shared resolver
          # rejects as a conflict when both are passed together; auditing
          # each hash-locked file independently sidesteps that and also
          # skips spinning up an ephemeral resolve venv per run.
          pip-audit -r requirements.lock.txt --disable-pip
          pip-audit -r requirements-dev.lock.txt --disable-pip
        continue-on-error: true

      - name: Run tests with coverage
        run: pytest --cov-report=xml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        # --ignore-scripts (SonarCloud githubactions:S6505): no dependency's
        # install/postinstall script runs on the runner. The only package
        # with one is puppeteer (pulled in by pa11y-ci), whose postinstall
        # downloaded Chrome; that download is now the explicit, separate step
        # below instead of an implicit lifecycle script. Every other script
        # we use (`npm test`, `npm run test:a11y`) is run by name, not by npm
        # lifecycle hooks, so --ignore-scripts does not affect them.
        run: npm ci --ignore-scripts

      - name: Install Chrome for the accessibility scan (puppeteer)
        # Replaces puppeteer's skipped postinstall download. `--no-install`
        # runs the puppeteer CLI from the lockfile-pinned node_modules copy
        # (never a registry fetch), which downloads the exact Chrome build
        # that puppeteer version is pinned to into ~/.cache/puppeteer.
        run: npx --no-install puppeteer browsers install chrome

      - name: Node unit tests (node --test)
        # plan.md §41.3: this suite was never wired into CI. tests_js/sentry_init.test.js
        # (14 cases) verifies halachic question/answer text, Clerk auth tokens, and
        # session cookies never reach Sentry (plan.md §17); Prompt 32/§19 Phase 0 added
        # tests_js/reader_ui_semantic_bookmark.test.js (4 cases) with the same exposure.
        # Both pass locally today (18/18) and gate PII-scrubbing correctness, so this is
        # blocking rather than continue-on-error, unlike ruff/pip-audit above (which are
        # non-blocking because their fix workflows aren't established yet). The glob form
        # (package.json's `test` script, `node --test tests_js/*.test.js`) sidesteps a
        # Node bug where a bare directory argument to `--test` throws
        # `Cannot find module` (plan.md §41.4) — confirmed on Node v26.7.0 locally; this
        # step is the first run against the CI runner's pinned Node 24 specifically.
        run: npm test

      - name: Accessibility scan (pa11y-ci, WCAG2AA — light + dark theme)
        # plan.md §8.F.2 / Prompt 18 item 2: automated axe/pa11y-style check
        # for key pages, gating the job on any real WCAG 2.1 AA violation.
        # `npm run test:a11y` runs BOTH themes in this one step (light via
        # pa11y-ci, then dark via scripts/a11y_dark_scan.js) so a red run is
        # one signal, not two -- plan.md §26.2 closed the dark-theme
        # coverage hole this step shipped with. Chained with && : if light
        # fails, dark is skipped, because the first failure is the one to
        # fix.
        # README.md's documented "Plain Flask mode" start command
        # (`python3 app.py`) is used here -- .pa11yci.json's URLs target its
        # documented default port (5001). Env vars mirror
        # tests/conftest.py's offline test matrix (mock keys, auth
        # enforcement off) so this boots without any real external
        # credentials and never calls a live third-party API.
        # RATELIMIT_ENABLED=false is now a no-op here: plan.md §16.8.1
        # removed Flask-Limiter, and the replacement
        # (backend.rate_limit.RateLimitMiddleware) only runs on asgi.py's
        # fastapi_app, which this bare `python3 app.py` boot never goes
        # through. Left set rather than removed -- harmless, and documents
        # the intent if Flask ever grows its own limiter again.
        run: |
          FLASK_ENV=testing \
          CLERK_ENFORCE_AUTH=false \
          RATELIMIT_ENABLED=false \
          SEFARIA_API=https://mock.sefaria.org/api \
          SEFARIA_V3_API=https://mock.sefaria.org/api/v3 \
          SUPABASE_URL=https://mock.supabase.co \
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_mock-key \
          SUPABASE_SECRET_KEY=sb_secret_mock-key \
          ANTHROPIC_API_KEY=mock-anthropic-key \
          GEMINI_API_KEY=mock-gemini-key \
          LOG_LEVEL=ERROR \
          python3 app.py &
          echo $! > /tmp/shelah_flask.pid

          for i in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:5001/; then
              echo "Flask app is up."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Flask app did not become ready in time." >&2
              kill "$(cat /tmp/shelah_flask.pid)" 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          npm run test:a11y
          status=$?
          kill "$(cat /tmp/shelah_flask.pid)" 2>/dev/null || true
          exit $status

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
