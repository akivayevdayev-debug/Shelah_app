{% from "components/icons.html" import phosphor %}
<header role="banner"
    class="topbar sticky top-0 z-[200] bg-white text-slate-800 py-1.5 px-2 lg:py-1.5 lg:px-3 shadow-sm border-b flex flex-wrap lg:flex-nowrap justify-between items-center flex-shrink-0 gap-1.5 lg:gap-2">
    <button type="button" id="brandHomeBtn" class="topbar-brand flex items-center gap-1.5 shrink-0"
        aria-label="Go to home" onclick="goHome()">
        <span class="text-navy font-hebrew topbar-brand-icon font-semibold leading-tight">
            ש
        </span>
        <span class="topbar-brand-title text-sm sm:text-base font-serif tracking-tight text-navy font-semibold leading-none text-start">
            <span class="block" data-en="Sh'elah" data-he="שאלה">Sh'elah</span>
            <span class="block text-[10px] font-normal text-slate-500 italic topbar-brand-subtitle"
                data-en="Torah Encyclopedia" data-he="אנציקלופדיית תורה">Torah Encyclopedia</span>
        </span>
    </button>

    <div id="topbarControls"
        class="topbar-controls relative z-[110] flex gap-1.5 items-center flex-wrap justify-end w-full lg:w-auto ml-auto">
        <!-- Theme Toggle — stands in for the main app's Quick Settings gear;
             legal pages carry no settings panel, so this is a direct
             icon-only light/dark toggle instead of a labeled "Appearance"
             button. -->
        <button id="themeToggleBtn" type="button" class="topbar-flat-btn text-[#7a6a52]" aria-live="polite"
            title="Switch to dark mode">
            {{ phosphor('moon', size=16, class='h-4 w-4', id='themeToggleMoonIcon') }}
            {{ phosphor('sun', size=16, class='hidden h-4 w-4', id='themeToggleSunIcon') }}
        </button>

        <div id="authControls" class="hidden items-center gap-1.5 mr-1">
            <div id="userProfileMenuContainer" class="hidden relative shrink-0">
                <button id="userProfileMenuBtn" type="button" aria-expanded="false" aria-haspopup="true"
                    class="topbar-user-menu-btn topbar-flat-btn text-xs text-[#334155] inline-flex items-center gap-1.5"
                    title="Open profile menu">
                    <span id="userProfileMenuLabel" class="max-w-[130px] truncate">Signed in</span>
                    {{ phosphor('caret-down', size=14, class='h-3.5 w-3.5') }}
                </button>

                <div id="userProfileMenu"
                    class="hidden absolute top-full right-0 w-44 max-w-[calc(100vw-1rem)] bg-white border border-slate-200 rounded-xl shadow-lg py-1.5 z-[999]">
                    <a id="userProfileLink" href="/profile"
                        class="topbar-user-menu-item block px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-100 transition"
                        data-en="Profile" data-he="פרופיל">Profile</a>
                    <button id="userProfileSignOutAction" type="button"
                        class="topbar-user-menu-item topbar-user-menu-signout w-full text-start px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-100 transition"
                        data-en="Sign Out" data-he="התנתקות">Sign Out</button>
                    <a id="userProfileTermsLink" href="/terms" target="_blank" rel="noopener"
                        class="topbar-user-menu-item block px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-100 transition"
                        data-en="Terms of Service" data-he="תנאי השירות">Terms of Service</a>
                    <a id="userProfilePrivacyLink" href="/privacy" target="_blank" rel="noopener"
                        class="topbar-user-menu-item block px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-100 transition"
                        data-en="Privacy Policy" data-he="מדיניות הפרטיות">Privacy Policy</a>
                    <a id="userProfileAccessibilityLink" href="/accessibility" target="_blank" rel="noopener"
                        class="topbar-user-menu-item block px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-100 transition"
                        data-en="Accessibility" data-he="נגישות">Accessibility</a>
                    <a id="userProfileAiDisclosureLink" href="/ai-disclosure" target="_blank" rel="noopener"
                        class="topbar-user-menu-item block px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-100 transition"
                        data-en="AI Disclosure" data-he="גילוי נאות בינה מלאכותית">AI Disclosure</a>
                </div>
            </div>

            <button id="signInBtn" type="button" class="topbar-flat-btn" data-en="Sign In" data-he="התחברות">Sign
                In</button>
        </div>

        <!-- Translator Toggles -->
        <button onclick="toggleLanguage('en')" class="hidden lg:inline-flex topbar-flat-btn font-serif lang-btn"
            data-lang="en">English</button>
        <button onclick="toggleLanguage('he')" class="hidden lg:inline-flex topbar-flat-btn font-hebrew lang-btn"
            data-lang="he">עברית</button>
        <button id="mobileLangToggle" type="button" class="lg:hidden topbar-flat-btn" data-en="עברית"
            data-he="English">עברית</button>
    </div>
</header>
