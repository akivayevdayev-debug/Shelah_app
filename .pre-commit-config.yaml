repos:
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: bandit-security-scan
        args: ["-r", ".", "-x", ".venv,venv,node_modules,test-results"]
        pass_filenames: false
        stages: [pre-commit, pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: gitleaks-secret-scan
        args: ["--redact", "--verbose"]
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      - id: check-prompt-doc-sync
        name: check-prompt-doc-sync (advisory)
        description: >-
          Flags claude_code_prompts.md rows whose status claim disagrees with
          the plan.md section they track. Advisory only (see plan.md §51) --
          never blocks the commit; verbose so the report still prints when
          these files are touched.
        entry: python3 scripts/check_prompt_doc_sync.py
        language: system
        files: ^(plan\.md|claude_code_prompts\.md)$
        pass_filenames: false
        verbose: true
        stages: [pre-commit]
